[package]
name = "stellar-liquidity-yield-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

# Pin ed25519-dalek to 2.x for native builds. soroban-env-host declares
# ed25519-dalek `>=2.0.0`, which resolves to 3.x on fresh checkouts; 3.x needs
# rand_core 0.9+ while the soroban host pins rand 0.8, breaking the build.
# Scoped to non-wasm targets: the wasm contract build does not use it.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ed25519-dalek = "2"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
