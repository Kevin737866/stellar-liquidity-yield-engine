name: Secret Scan

# Blocks committed environment secrets: tracked .env files, real values for
# secret keys in *.example templates, and credential-shaped strings (Stellar
# secret seeds, PEM private keys, GitHub tokens, AWS keys) in any tracked file.
# The rules and the allow pragma are documented in docs/SECRET_SCANNING.md.
#
# Runs on every pull request regardless of the paths it touches: a secret can
# land in any file, so this workflow deliberately has no path filters.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: scan tracked files for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Dependency-free: needs only node and git, so no `npm ci`.
      - name: Check for committed environment secrets
        run: node scripts/check-env-secrets.js

  test:
    name: secret scanner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run scanner unit tests
        run: npx jest scripts/check-env-secrets.test.ts
