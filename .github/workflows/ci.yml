name: Rust CI

# Builds and checks the Soroban contract crate in src/.
#
# The crate is split into one feature per contract (see `[features]` in
# Cargo.toml) because a wasm binary can only export a single contract's
# entrypoints. The `wasm` job below therefore builds each contract on its own.
#
# `cargo test` cannot resolve its dependencies on a bare checkout: soroban-env-host
# 22.1.3 declares `ed25519-dalek = ">=2.0.0"`, which now floats to the 3.x line
# and no longer compiles against the host. The `Pin ed25519-dalek` step in the
# `test` job pins the 2.x line before building, which is why the suite runs at all.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Same pin as the `test` job: on a bare checkout soroban-env-host floats
      # ed25519-dalek to the 3.x line, which does not compile against the host
      # (see the note at the top of this file). Without it clippy fails before
      # reaching this crate's code.
      - name: Pin ed25519-dalek to the 2.x line
        run: |
          cargo generate-lockfile
          cargo update -p ed25519-dalek@3.0.0 --precise 2.2.0

      # Lint the same targets the `test` job builds: the crate's library and
      # its unit tests, upgrade tests, and the dedicated router fuzz harness. The
      # other files in tests/ target contracts that are not part of the crate
      # (SwapRouter, RiskEngine, ProtocolGovernor, ...), so `--all-targets`
      # cannot be used until they are repaired - see the note in `test` below.
      - run: cargo clippy --lib --test upgrade_tests --test swap_router_fuzz --all-features -- -D warnings

  # Builds every Soroban contract to wasm. Each contract is a separate matrix
  # leg so a broken contract fails its own check with a readable name, and
  # `fail-fast: false` keeps the other legs running so the full set of results
  # is visible in one run.
  wasm:
    name: build wasm (${{ matrix.contract }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract:
          - engine
          - yield-vault
          - rebalance-engine
          - reward-distributor
          - strategy-registry
          - il-insurance
          - actuary
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build contract wasm
        run: |
          cargo build \
            --target wasm32-unknown-unknown \
            --release \
            --no-default-features \
            --features ${{ matrix.contract }}

      - name: Verify wasm artifact
        run: |
          wasm=target/wasm32-unknown-unknown/release/stellar_liquidity_yield_engine.wasm
          if [ ! -f "$wasm" ]; then
            echo "::error::expected wasm artifact was not produced: $wasm"
            exit 1
          fi
          # Soroban modules start with the wasm magic number `\0asm`.
          magic=$(head -c 4 "$wasm" | od -An -tx1 | tr -d ' \n')
          if [ "$magic" != "0061736d" ]; then
            echo "::error::$wasm is not a valid wasm module (magic bytes: $magic)"
            exit 1
          fi
          echo "built $wasm ($(wc -c < "$wasm") bytes)"

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm-${{ matrix.contract }}
          path: target/wasm32-unknown-unknown/release/stellar_liquidity_yield_engine.wasm
          if-no-files-found: error

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Pin the 2.x line of ed25519-dalek; see the note at the top of this file.
      # `--precise` needs the exact version, hence the `@3.0.0` selector.
      - name: Pin ed25519-dalek to the 2.x line
        run: |
          cargo generate-lockfile
          cargo update -p ed25519-dalek@3.0.0 --precise 2.2.0

      # `--lib` runs the contract tests. The router harness compiles the actual
      # dormant router source without enabling a deployment feature. Other files in tests/ target
      # contracts that are not part of the crate (SwapRouter, RiskEngine,
      # ProtocolGovernor, ...), so they are excluded until they are repaired.
      - name: Run contract test suite
        run: cargo test --all-features --lib --test upgrade_tests --test swap_router_fuzz
