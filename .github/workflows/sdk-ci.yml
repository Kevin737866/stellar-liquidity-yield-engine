name: SDK CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ui/**'
  pull_request:
    paths-ignore:
      - 'ui/**'

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      - run: npm test
